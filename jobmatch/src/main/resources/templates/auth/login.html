<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Вхід')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<nav th:replace="~{fragments :: crumbs}"></nav>
<main id="main" class="wrap page">
    <div th:replace="~{fragments :: messages}"></div>
    <h1>Вхід</h1>
    <div class="alert alert-error" role="alert" th:if="${param.error}">
        <strong>Неправильний e-mail або пароль.</strong>
        <p><b>Як виправити зараз:</b> перевірте розкладку клавіатури та Caps Lock і введіть дані ще раз.</p>
        <p><b>Як запобігти надалі:</b> зберігайте пароль у менеджері паролів; якщо забули пароль — дивіться розділ «Допомога».</p>
    </div>
    <form class="form card" th:action="@{/login}" method="post" novalidate>
        <div class="field"><label for="email">E-mail <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" autocomplete="username" aria-required="true" autofocus></div>
        <div class="field"><label for="password">Пароль <span class="req" aria-hidden="true">*</span></label>
            <input type="password" id="password" name="password" autocomplete="current-password" aria-required="true"></div>
        <div class="form-actions"><button class="btn" type="submit">Увійти</button></div>
        <p class="small muted">Немає облікового запису? <a th:href="@{/register}">Зареєструйтеся</a>.</p>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
