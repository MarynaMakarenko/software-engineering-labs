<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Компанія')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<nav th:replace="~{fragments :: crumbs}"></nav>
<main id="main" class="wrap page">
    <div th:replace="~{fragments :: messages}"></div>
    <h1 th:text="${#strings.endsWith(action, 'new') ? 'Нова компанія' : 'Редагування компанії'}">Компанія</h1>
    <form class="card form" th:action="@{${action}}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments :: formErrors(${form})}"></div>
        <div th:replace="~{fragments :: input('name', 'Назва', 'text', true, 'Унікальна в JobMatch, 2–120 символів.')}"></div>
        <div th:replace="~{fragments :: input('city', 'Місто', 'text', true, null)}"></div>
        <div th:replace="~{fragments :: input('address', 'Адреса офісу', 'text', true, null)}"></div>
        <div th:replace="~{fragments :: input('phone', 'Телефон', 'tel', true, 'Формат: +380XXXXXXXXX')}"></div>
        <div th:replace="~{fragments :: input('email', 'E-mail', 'email', true, null)}"></div>
        <div th:replace="~{fragments :: input('website', 'Сайт', 'url', false, 'Починається з https://')}"></div>
        <div th:replace="~{fragments :: textarea('description', 'Опис компанії', 2000, null)}"></div>
        <div class="form-actions"><button class="btn" type="submit">Зберегти</button>
            <a class="btn btn-ghost" th:href="@{${#strings.startsWith(action, '/company') ? '/company' : '/recruiter/companies'}}">Скасувати</a></div>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
