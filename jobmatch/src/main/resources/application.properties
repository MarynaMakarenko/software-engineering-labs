spring.application.name=JobMatch
server.port=8090
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# H2 у файловому режимі (сумісність з PostgreSQL); для хостингу — профіль prod
spring.datasource.url=jdbc:h2:file:./data/jobmatch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=jobmatch
spring.datasource.password=jobmatch
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Kyiv
spring.flyway.locations=classpath:db/migration,classpath:db/seed

spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
spring.mvc.format.date=iso
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.level.org.hibernate.SQL=warn
spring.web.locale=uk_UA
spring.web.locale-resolver=fixed
